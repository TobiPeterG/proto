[Config]
ConfigureScripts=%D/mkosi.configure

[Content]
ExtraTrees=%D/mkosi.initrd.extra
SELinuxRelabel=no
RemoveFiles=
    # Match the desktop images' NvPCR opt-out. Retirement: systemd#42615
    /usr/lib/nvpcr/*.nvpcr
    # TODO(openSUSE Plymouth packaging): Remove this dracut purge when the
    # Plymouth package set no longer pulls dracut hooks into the native initrd.
    /etc/dracut.conf
    /etc/dracut.conf.d
    /usr/bin/dracut
    /usr/bin/lsinitrd
    /usr/lib/dracut
    /usr/lib/systemd/system/dracut-*.service
    /usr/lib/systemd/system/initrd.target.wants/dracut-*.service
    /usr/lib/systemd/system/sysinit.target.wants/dracut-*.service
Packages=
# mkosi selects its bootstrap release from package names
Packages=patterns-proto-initrd proto-release
