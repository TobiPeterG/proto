[Match]
PathExists=!/.build.binaries

[Distribution]
RepositoryKeyFetch=yes

[Build]
# The built-in openSUSE tools tree carries python3-pefile, erofs-utils and the
# other host-side image tools. This also keeps local and OBS builds aligned.
ToolsTree=default
ToolsTreeDistribution=opensuse
ToolsTreeRelease=tumbleweed
SandboxTrees=%D/mkosi.repositories
ToolsTreeSandboxTrees=%D/mkosi.repositories
ToolsTreePackages=
    desync