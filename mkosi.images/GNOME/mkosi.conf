[Config]
Dependencies=base

[Output]
Format=disk
RepartDirectories=%D/mkosi.repart
ImageId=proto-gnome
Output=%i_%v_%a
CompressOutput=xz
ManifestFormat=json
SplitArtifacts=uki,partitions,roothash,os-release

[Validation]
SecureBootAutoEnroll=no
Verity=defer
Checksum=yes

[Content]
BaseTrees=%O/base
WithRecommends=no
ExtraTrees=%D/mkosi.extra
SELinuxRelabel=yes
KernelModulesInitrd=yes
Bootable=yes
Bootloader=systemd-boot
ShimBootloader=signed
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v_%a
FinalizeScripts=
    %D/mkosi.finalize.chroot
    %D/mkosi.finalize
KernelCommandLine=
    quiet
    splash
    loglevel=3
    rd.udev.log_level=3
    udev.log_level=3
    rd.systemd.show_status=auto
    systemd.show_status=auto
    root=gpt-auto
    rootfstype=btrfs
    rw
    mount.usr=dissect
    mount.usrfstype=erofs
    mount.usrflags=ro
    systemd.image_policy=root=unprotected+encrypted:usr=signed:esp=unprotected:xbootldr=unprotected
    systemd.allow_userspace_verity=no
    security=selinux
    selinux=1
    enforcing=0
    rd.systemd.mount-extra=/dev/gpt-auto-root:/sysroot/.system:btrfs:subvol=/,nodev,nosuid,x-gvfs-hide,x-gdu.hide
Packages=
    gdm-lang
    gnome-bluetooth-lang
    gnome-color-manager-lang
    gnome-console-lang
    gnome-control-center-lang
    gnome-disk-utility-lang
    gnome-initial-setup-lang
    gnome-keyring-lang
    gnome-online-accounts-lang
    gnome-remote-desktop-lang
    gnome-session-lang
    gnome-settings-daemon-lang
    gnome-shell-lang
    gnome-software-lang
    gnome-system-monitor-lang
    gnome-text-editor-lang
    gnome-user-docs-lang
    gvfs-lang
    nautilus-lang
    orca-lang
    polkit-gnome-lang
    yelp-lang
    zenity-lang
    patterns-gnome-gnome_basic
    brltty-driver-speech-dispatcher
    chrome-gnome-shell
    desktop-file-utils
    gdm
    gdm-branding-upstream
    gdm-systemd
    gcr-ssh-agent
    gcr-ssh-askpass
    gcr3-ssh-askpass
    gnome-backgrounds
    gnome-bluetooth
    gnome-color-manager
    gnome-control-center-color
    gnome-control-center-goa
    gnome-control-center-user-faces
    gnome-control-center-users
    gnome-disk-utility
    gnome-initial-setup
    gnome-menus-branding-upstream
    gnome-keyring-pam
    gnome-online-accounts
    gnome-remote-desktop
    gnome-session-default-session
    gnome-session-wayland
    gnome-shell-calendar
    gnome-shell-search-provider-nautilus
    gnome-software
    gnome-software-plugin-systemd-sysupdate
    gnome-system-monitor
