[Config]
Dependencies=base

[Output]
Format=disk
RepartDirectories=%D/mkosi.repart
ImageId=proto-gnome
Output=%i_%v_%a
CompressOutput=xz
ManifestFormat=json
SplitArtifacts=uki,partitions,roothash,os-release

[Validation]
SecureBootAutoEnroll=no
Verity=defer
Checksum=yes

[Content]
BaseTrees=%O/base
ExtraTrees=%D/mkosi.extra
SELinuxRelabel=yes
KernelModulesInitrd=yes
KernelInitrdModules=
    btrfs
    dm-verity
    erofs
Bootable=yes
Bootloader=systemd-boot
ShimBootloader=signed
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v_%a
FinalizeScripts=
    %D/mkosi.finalize.chroot
    %D/mkosi.finalize
PostOutputScripts=%D/mkosi.postoutput
KernelCommandLine=
    root=gpt-auto
    rootfstype=btrfs
    rw
    mount.usr=dissect
    systemd.image_policy=usr=signed
    systemd.allow_userspace_verity=no
    security=selinux
    selinux=1
    enforcing=0
    rd.systemd.mount-extra=/dev/gpt-auto-root:/sysroot/.system:btrfs:subvol=/,nodev,nosuid,x-gvfs-hide,x-gdu.hide
    rd.systemd.mount-extra=/dev/gpt-auto-root:/sysroot/etc:btrfs:subvol=/@etc
Packages=
    patterns-gnome-gnome_basic
    brltty-driver-speech-dispatcher
    chrome-gnome-shell
    desktop-file-utils
    gdm
    gcr-ssh-agent
    gcr-ssh-askpass
    gcr3-ssh-askpass
    gnome-backgrounds
    gnome-bluetooth
    gnome-color-manager
    gnome-control-center-color
    gnome-control-center-goa
    gnome-control-center-user-faces
    gnome-control-center-users
    gnome-disk-utility
    gnome-initial-setup
    gnome-keyring-pam
    gnome-online-accounts
    gnome-remote-desktop
    gnome-session-default-session
    gnome-session-wayland
    gnome-shell-calendar
    gnome-shell-search-provider-nautilus
    gnome-software
    gnome-system-monitor
    gnome-user-docs
    gnome-console
    gnome-text-editor
    gsf-office-thumbnailer
    gstreamer-plugins-bad
    gstreamer-plugins-good
    gvfs-backend-afc
    gvfs-backend-goa
    gvfs-backend-samba
    gvfs-backends
    gvfs-fuse
    jxl-thumbnailer
    malcontent-control
    nautilus
    nautilus-extension-seahorse
    nautilus-share
    NetworkManager-openconnect-gnome
    NetworkManager-openvpn-gnome
    openssh-askpass-gnome
    orca
    pinentry-gnome3
    polkit-gnome
    python3-nautilus
    rsvg-thumbnailer
    samba
    seahorse-daemon
    speech-dispatcher-module-espeak
    xdg-desktop-portal-gnome
    xdg-user-dirs-gtk
    yelp
    zenity
