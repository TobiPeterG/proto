[Config]
Dependencies=GNOME-root installer-resources
ConfigureScripts=%D/mkosi.configure

[Output]
Format=disk
RepartDirectories=%D/mkosi.repart
ImageId=proto-gnome
Output=%i_%v_%a
CompressOutput=xz
ManifestFormat=
SplitArtifacts=uki,partitions,roothash,os-release

[Validation]
SecureBootAutoEnroll=no
Verity=defer
Checksum=yes

[Content]
BaseTrees=%O/proto-gnome_%v_%a.buildroot
CleanPackageMetadata=yes
WithRecommends=no
ExtraTrees=
# TODO(systemd#42615): Restore optional NvPCR definitions
RemoveFiles=/usr/lib/nvpcr/*.nvpcr
SELinuxRelabel=yes
KernelModulesInitrd=yes
Bootable=yes
Bootloader=systemd-boot
ShimBootloader=signed
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v_%a
FinalizeScripts=
    %D/mkosi.finalize
KernelCommandLine=
    quiet
    splash
    loglevel=3
    rd.udev.log_level=3
    udev.log_level=3
    rd.systemd.show_status=auto
    systemd.show_status=auto
    root=gpt-auto
    rootfstype=btrfs
    rw
    mount.usr=dissect
    mount.usrfstype=erofs
    mount.usrflags=ro
    # Keep usrhash verification, but resolve devices on the boot disk instead
    # of global PARTUUID links shared by the live and installed A images.
    systemd.verity_usr_data=/dev/disk/by-designator/usr-verity-data
    systemd.verity_usr_hash=/dev/disk/by-designator/usr-verity
    # Disable only optional NvPCR measurements
    systemd.verity_usr_options=root-hash-signature=auto,tpm2-measure-nvpcr=no
    # USER is absent until first-boot provisioning creates it.
    systemd.image_policy=root=unprotected+encrypted+absent:usr=signed:esp=unprotected:xbootldr=unprotected
    systemd.allow_userspace_verity=no
    security=selinux
    selinux=1
    enforcing=0
Packages=
