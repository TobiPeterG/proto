[Config]
Dependencies=base

[Output]
Format=disk
RepartDirectories=%D/mkosi.repart
ImageId=proto-kde
Output=%i_%v_%a
CompressOutput=xz
ManifestFormat=json
SplitArtifacts=uki,partitions,roothash,os-release

[Validation]
SecureBootAutoEnroll=no
Verity=defer
Checksum=yes

[Content]
BaseTrees=%O/base
WithRecommends=no
ExtraTrees=%D/mkosi.extra
SELinuxRelabel=yes
KernelModulesInitrd=yes
Bootable=yes
Bootloader=systemd-boot
ShimBootloader=signed
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v_%a
FinalizeScripts=
    %D/mkosi.finalize.chroot
    %D/mkosi.finalize
KernelCommandLine=
    quiet
    splash
    loglevel=3
    rd.udev.log_level=3
    udev.log_level=3
    rd.systemd.show_status=auto
    systemd.show_status=auto
    root=gpt-auto
    rootfstype=btrfs
    rw
    mount.usr=dissect
    mount.usrfstype=erofs
    mount.usrflags=ro
    systemd.image_policy=root=unprotected+encrypted:usr=signed:esp=unprotected:xbootldr=unprotected
    systemd.allow_userspace_verity=no
    security=selinux
    selinux=1
    enforcing=0
    rd.systemd.mount-extra=/dev/gpt-auto-root:/sysroot/.system:btrfs:subvol=/,nodev,nosuid,x-gvfs-hide,x-gdu.hide
Packages=
    ark-lang
    aurorae6-lang
    bluedevil6-lang
    discover6-lang
    dolphin-part-lang
    flatpak-kcm6-lang
    kaccounts-integration-lang
    kaccounts-providers-lang
    kate-lang
    kde-inotify-survey-lang
    kdeconnect-kde-lang
    kdenetwork-filesharing-lang
    kdeplasma6-addons-lang
    kio-extras-lang
    kio-gdrive-lang
    konsole-part-lang
    kwalletmanager-lang
    partitionmanager-lang
    plasma6-browser-integration-lang
    plasma6-desktop-lang
    plasma6-nm-lang
    plasma6-pa-lang
    plasma6-print-manager-lang
    plasma6-setup-lang
    plasma6-systemmonitor-lang
    plasma6-workspace-lang
    sddm-kcm6-lang
    spectacle-lang
