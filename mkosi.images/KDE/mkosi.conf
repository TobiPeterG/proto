[Config]
Dependencies=base

[Output]
Format=disk
RepartDirectories=%D/mkosi.repart
ImageId=proto-kde
Output=%i_%v_%a
CompressOutput=xz
ManifestFormat=json
SplitArtifacts=uki,partitions,roothash,os-release

[Validation]
SecureBootAutoEnroll=no
Verity=defer
Checksum=yes

[Content]
BaseTrees=%O/base
ExtraTrees=%D/mkosi.extra
SELinuxRelabel=yes
KernelModulesInitrd=yes
Bootable=yes
Bootloader=systemd-boot
ShimBootloader=signed
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v_%a
FinalizeScripts=
    %D/mkosi.finalize.chroot
    %D/mkosi.finalize
PostOutputScripts=%D/mkosi.postoutput
KernelCommandLine=
    root=gpt-auto
    rootfstype=btrfs
    rw
    mount.usr=dissect
    systemd.image_policy=usr=signed
    systemd.allow_userspace_verity=no
    security=selinux
    selinux=1
    enforcing=0
    rd.systemd.mount-extra=/dev/gpt-auto-root:/sysroot/.system:btrfs:subvol=/,nodev,nosuid,x-gvfs-hide,x-gdu.hide
    rd.systemd.mount-extra=/dev/gpt-auto-root:/sysroot/etc:btrfs:subvol=/@etc
Packages=
    patterns-kde-kde_plasma
    ark
    aurorae6
    bluedevil6
    breeze6-wallpapers
    ddcutil-i2c-udev-rules
    desktop-data
    sddm
    discover6
    discover6-backend-flatpak
    discover6-backend-fwupd
    discover6-notifier
    dolphin
    ffmpegthumbs
    flatpak-kcm6
    kaccounts-integration
    kaccounts-providers
    kde-gtk-config6-gtk3
    kde-inotify-survey
    kde-linux-sysupdated
    kde-print-manager
    kdeconnect-kde
    kdegraphics-thumbnailers
    kdenetwork-filesharing
    konsole
    kdnssd
    kf6-baloo-file
    kf6-purpose
    kf6-qqc2-desktop-style
    kgamma6
    kio-extras
    kio-fuse
    kio-gdrive
    ksshaskpass6
    kunifiedpush
    kwalletmanager
    kdeplasma6-addons
    kate
    libappindicator3-1
    Mesa-demo-egl
    ocean-sound-theme6
    pam_kwallet6
    partitionmanager
    pinentry
    plasma-browser-integration
    plasma6-desktop-emojier
    plasma6-nm-openconnect
    plasma6-nm-openvpn
    plasma6-pa
    plasma6-systemmonitor
    plasma6-workspace-wallpapers
    qt6-imageformats
    sddm-kcm6
    spectacle
    zenity
