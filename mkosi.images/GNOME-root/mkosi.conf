[Config]
Dependencies=base
ConfigureScripts=%D/mkosi.configure

[Output]
Format=directory
ImageId=proto-gnome
Output=%i_%v_%a.buildroot
ManifestFormat=
SplitArtifacts=

[Content]
BaseTrees=%O/base
Bootable=no
WithRecommends=no
CleanPackageMetadata=no
ExtraTrees=%D/mkosi.extra
# Apply the same filesystem cleanup as the final image, except RPM metadata.
# TODO(systemd#42615): Restore optional NvPCR definitions after hardware testing.
RemoveFiles=/usr/lib/nvpcr/*.nvpcr
SELinuxRelabel=yes
FinalizeScripts=
    %D/mkosi.buildroot.finalize
    %D/mkosi.finalize.chroot
PostOutputScripts=
    %D/mkosi.buildroot.postoutput
    %D/mkosi.obs/buildroot-rpm.py
Packages=patterns-proto-gnome
