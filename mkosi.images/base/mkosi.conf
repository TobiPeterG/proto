[Config]
ConfigureScripts=%D/mkosi.configure

[Output]
Format=directory
Output=base
ManifestFormat=

[Content]
ExtraTrees=
Bootable=no
# Desktop build roots need the installed-package database of this base.
# Only the bootable packaging stages strip it from their own filesystem copy.
CleanPackageMetadata=no
Ssh=no
WithDocs=no
WithRecommends=no
Packages=patterns-proto-base
