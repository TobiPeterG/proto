# needssslcertforbuild

# OBS entry point for the proto-kde package. Packages= is generated from the
# base, default-initrd and KDE images because OBS parses this file before
# mkosi evaluates dependency images. Run ./update-obs-packages.py after changes.
[Config]
MinimumVersion=27
Dependencies=
    base
    KDE

[Distribution]
Distribution=opensuse
Release=tumbleweed

[Output]
Format=none
OutputDirectory=mkosi.output

[Build]
Incremental=yes
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
MakeScriptsExecutable=yes

[Content]
SourceDateEpoch=1788134400
Bootable=no
WithRecommends=no
