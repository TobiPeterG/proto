# needssslcertforbuild

# OBS entry point for the proto-kde package. Packages= is generated from the
# base, desktop, initrd and installer resource patterns. OBS parses this file
# before mkosi evaluates dependency images.
[Config]
MinimumVersion=27
Dependencies=
    base
    KDE

[Distribution]
Distribution=opensuse
Release=tumbleweed

[Output]
Format=none
OutputDirectory=mkosi.output

[Build]
Incremental=yes
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
MakeScriptsExecutable=yes

[Content]
Bootable=no
WithRecommends=no
InitrdPackages=patterns-proto-initrd
Packages=
    bash
    btrfsprogs
    diffutils
    dosfstools
    e2fsprogs
    grep
    gzip
    less
    libcryptsetup12
    libfdisk1
    libfido2-1
    libseccomp2
    libtss2-esys0
    libtss2-mu0
    libtss2-rc0
    libtss2-tcti-device0
    patterns-base-minimal_base
    patterns-proto-base
    patterns-proto-build-tools
    patterns-proto-initrd
    patterns-proto-installer
    patterns-proto-kde
    procps
    systemd
    udev
    util-linux
    xfsprogs
    xz
