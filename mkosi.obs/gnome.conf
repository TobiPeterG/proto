# needssslcertforbuild

# OBS entry point for the proto-gnome package. Packages= is generated from the
# base, default-initrd and GNOME images because OBS parses this file before
# mkosi evaluates dependency images. Run ./update-obs-packages.py after changes.
[Config]
MinimumVersion=27
Dependencies=
    base
    GNOME

[Distribution]
Distribution=opensuse
Release=tumbleweed

[Output]
Format=none
OutputDirectory=mkosi.output

[Build]
Incremental=yes
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
MakeScriptsExecutable=yes

[Content]
SourceDateEpoch=1788134400
Bootable=no
WithRecommends=no
InitrdPackages=libtss2-tcti-device0
