[Unit]
# Native completion releases the ordinary root links and consumes the EFI
# request. Do not do so if repart or human passphrase enrollment failed.
Requires=systemd-repart.service proto-user-provision.service
After=systemd-repart.service proto-user-provision.service

[Service]
ExecStartPre=/usr/bin/test -e /run/proto-user-provision.complete
