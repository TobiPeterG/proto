[Partition]
Type=usr
# TODO(installer-layout): Do not allocate this empty B slot (nor its matching
# Verity/hash signature partitions) in the published installer image. Keep the
# definitions in the installed system and in Tik's target layout so
# systemd-repart creates the complete A/B set on the destination disk. This
# needs separate build/live and target repart definition sets; otherwise the
# initrd's automatic systemd-repart invocation may add B to the installer
# medium itself.
Format=empty
SizeMinBytes=8G
SizeMaxBytes=8G
SplitName=-
