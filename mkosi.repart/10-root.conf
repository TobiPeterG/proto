[Partition]
Type=root
Format=btrfs
Minimize=guess

# The Btrfs root contains mutable state and versioned /usr images, not a
# second copy of the packaged OS tree.
CopyFiles=/bin:/bin
CopyFiles=/lib:/lib
CopyFiles=/lib64:/lib64
CopyFiles=/sbin:/sbin
CopyFiles=/opt:/opt
CopyFiles=/root:/root
CopyFiles=/srv:/srv
MakeDirectories=/efi /dev /etc /home /media /mnt /proc /run /.system /sys /tmp /usr /var
