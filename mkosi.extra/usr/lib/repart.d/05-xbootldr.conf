[Partition]
Type=xbootldr
Label=XBOOTLDR
Format=vfat
CopyFiles=/boot:/
# Keep an unconditional XBOOTLDR until systemd#43891 is fixed. systemd-repart
# aborts in _hashmap_merge() when SupplementFor= definitions are merged.
# TODO(systemd#43891): Restore conditional ESP/XBOOTLDR supplementation after
# the fix is available in the minimum supported systemd version.
SizeMinBytes=4G
SizeMaxBytes=4G
