[Partition]
Type=xbootldr
Label=XBOOTLDR
Format=vfat
CopyFiles=/boot:/
# Keep an unconditional XBOOTLDR while SupplementFor= merging can abort in
# _hashmap_merge().
# TODO(systemd#43890, PR#43924): Reconsider conditional supplementation after
# the fix is shipped in the minimum build/runtime version AND the FAT merge
# reproducer passes.
SizeMinBytes=4G
SizeMaxBytes=4G
