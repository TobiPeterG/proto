[Partition]
Type=root
Label=USER
Format=btrfs
# TODO(firstboot-root, systemd>=262): Let the first installed boot create this
# encrypted partition instead of Tik creating it while deploying the image.
# A required initrd enrollment step should use systemd-cryptenroll's first-boot
# UI to add and verify a user passphrase and/or displayed recovery key, remove
# every bootstrap keyslot, and only then permit switch-root. Upstream's optional
# systemd-cryptenroll-firstboot.service must be made mandatory for this use.
# After the new root, machine ID, filesystem identity, and PCR-15 volume-key
# measurement exist, build Proto's PCR-lock policy and enroll the TPM against
# PCR 0, PCR 7, the signed PCR-11 policy, and PCR 15. Do not let repart create
# the final TPM enrollment before those machine-local policy inputs exist.
Encrypt=key-file
SizeMinBytes=8G
CopyFiles=/usr/lib/proto/installer-root-skeleton:/@root
CopyFiles=/usr/share/factory/etc:/@etc
MakeDirectories=/@root/boot /@root/dev /@root/efi /@root/etc /@root/home /@root/media /@root/mnt /@root/opt /@root/proc /@root/root /@root/run /@root/srv /@root/.system /@root/sys /@root/tmp /@root/usr /@root/var /@etc
Subvolumes=/@root /@etc
DefaultSubvolume=/@root
GrowFileSystem=yes
