d /etc/sysconfig 0755 root root -
f /etc/sysconfig/snapper 0644 root root - SNAPPER_CONFIGS=""
d /etc/snapper/configs 0755 root root -
# /.system exposes the Btrfs top-level for the initrd-selected EROFS backing
# file. Keep deployment internals out of ordinary users' file-manager views.
z /.system 0700 root root -
