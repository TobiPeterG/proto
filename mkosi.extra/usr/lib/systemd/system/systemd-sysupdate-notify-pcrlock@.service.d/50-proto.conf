[Unit]
ConditionKernelCommandLine=!proto.installer=yes
RequiresMountsFor=/boot /efi /var/lib/systemd /var/lib/pcrlock.d

[Service]
# Keep flags identical to systemd-pcrlock@.service.d/50-proto.conf: fwupd and
# sysupdate must use the same PCR selection and native publication behavior.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock --location=770 --policy=/var/lib/systemd/pcrlock.json --pcr=0 --pcr=7 --pcr=15
