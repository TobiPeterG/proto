# needssslcertforbuild

[Config]
MinimumVersion=26
Dependencies=
    base
    KDE
    GNOME

[Distribution]
Distribution=opensuse
Release=tumbleweed
RepositoryKeyFetch=yes

[Output]
Format=none
OutputDirectory=mkosi.output

[Build]
# The built-in openSUSE tools tree carries python3-pefile, erofs-utils and the
# other host-side image tools. This also keeps local and OBS builds aligned.
ToolsTree=default
ToolsTreeDistribution=opensuse
ToolsTreeRelease=tumbleweed
Incremental=yes
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
SandboxTrees=%D/mkosi.repositories
ToolsTreeSandboxTrees=%D/mkosi.repositories
ToolsTreePackages=
    desync

[Content]
SourceDateEpoch=1788134400
# OBS resolves dependencies from the top-level recipe before it evaluates the
# subimages. Keep the union here; the actual contents are in the subimages.
Bootable=no
